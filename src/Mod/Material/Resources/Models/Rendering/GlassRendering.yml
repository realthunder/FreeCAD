# A card carrying this model is rendered as a glass BODY -- refraction
# through the closed shape, Beer-Lambert absorption over its thickness and
# a Fresnel environment reflection -- rather than as a transparent surface.
# It inherits Basic Rendering because the absorption is tinted by the
# DIFFUSE colour (sigma = density * (1 - diffuse)), so the colour that
# makes a glass green rather than clear is Basic Rendering's, not a field
# of its own.
#
# The three values map onto the Render_Glass* view properties. Each keeps
# that family's sentinel: <= 0 means "let the engine decide", it does not
# mean zero.

AppearanceModel:
  Name: "Glass Rendering"
  UUID: '59ae40ef-3aeb-46a8-8f80-47cf609bf513'
  URL: ''
  Description: "Renders the closed shape as a glass body"
  DOI: ""
  Inherits:
    - BasicRendering:
      UUID: 'f006c7e4-35b7-43d5-bbf9-c5d572309e6e'
  GlassIOR:
    DisplayName: "Glass IOR"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: "Index of refraction; 0 = default (1.5). Window glass is about 1.52, acrylic 1.49"
  GlassDensity:
    DisplayName: "Glass Density"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: "Absorption density in inverse model units; 0 = automatic from the body extent"
  GlassRoughness:
    DisplayName: "Glass Roughness"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: "Surface roughness 0..1; blurs the reflection and the refraction. 0 = polished"
