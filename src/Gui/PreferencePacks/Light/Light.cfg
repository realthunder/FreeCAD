               #267F99, function #795E26, operator #3C3C3C, output #616161,
               error #CD3131, the cursor's line #DDE6F4. Until 2026-10 these
               were the Dark theme's, pale ones made for a dark page: an
               operator was #D4D4D4 on #FAFAFA. Each stands 4.4 to 1 or
               better against the page (tests/gui/editor-colours-follow-
               the-theme.py). -->
          <FCUInt Name="Keyword" Value="65280"/>
          <FCUInt Name="Comment" Value="8388608"/>
          <FCUInt Name="Block comment" Value="2736067840"/>
          <FCUInt Name="Number" Value="159799296"/>
