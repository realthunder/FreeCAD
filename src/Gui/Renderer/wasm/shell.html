<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <!-- Mobile: match the device width and let the canvas reflow on rotation.
       Without this the page renders at a desktop width and the canvas never
       resizes when the phone is rotated. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FreeCAD Viewer</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                 overflow: hidden; background: #000; }
    /* Fill the viewport; the C++ main loop reads the canvas CSS size each
       frame (emscripten_get_element_css_size) and resizes the drawing
       buffer to match, so making the CSS size viewport-relative is all that
       is needed for rotation/resize to work. touch-action:none stops the
       browser from consuming touch gestures (scroll/zoom) so our own touch
       orbit/pan/zoom + tap-pick handlers receive them.
       Use dynamic viewport units (dvw/dvh) so the canvas tracks the VISIBLE
       viewport on mobile: static 100vh is the tall layout viewport (browser
       chrome hidden), so with the address bar shown the bottom of the canvas
       (and the bottom-right axis-cross overlay) fell below the fold. The
       vw/vh declarations are the fallback for browsers without dvh support. */
    #canvas { display: block; width: 100vw; height: 100vh;
              width: 100dvw; height: 100dvh; border: 0;
              outline: none; touch-action: none; }
    /* Discreet loading indicator: a 3px progress bar along the top edge
       plus a small muted label under it. Indeterminate mode (unknown
       total) slides a short segment across the bar. */
    #status { position: fixed; left: 0; right: 0; top: 0;
              pointer-events: none; z-index: 9999; }
    #progress { height: 3px; background: rgba(255,255,255,.08); }
    #progressfill { height: 100%; width: 0; background: #58a6ff;
                    transition: width .15s linear; }
    #progress.indet #progressfill { width: 25%;
                                    animation: fcindet 1.2s linear infinite; }
    @keyframes fcindet { from { margin-left: -25%; } to { margin-left: 100%; } }
    #statustext { text-align: center; font-family: sans-serif;
                  font-size: 11px; color: rgba(204,204,204,.75);
                  padding-top: 4px; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">
    <div id="progress"><div id="progressfill"></div></div>
    <div id="statustext">Loading…</div>
  </div>
  <script>
    // ?log — a console for a device that has none.
    //
    // Chrome on Android can only be inspected over USB, which is no
    // help to someone testing a model over the network, and a page
    // that has frozen or run out of memory cannot be asked anything
    // afterwards either. So this does two things, both before the
    // wasm module loads so that nothing it says is missed:
    //
    //  - mirrors every console line into an overlay on the page, so a
    //    freeze leaves the last lines *on screen* rather than nowhere;
    //  - beacons each line to the scene server's /log, which appends
    //    it to the log of the machine serving the scene. sendBeacon
    //    because it is fire and forget and survives the page dying —
    //    a viewer must never wait on its own logging, and what caused
    //    a freeze is whatever it managed to say just before it.
    //
    // ?log=quiet keeps the beacon and leaves the screen alone.
    (function () {
      var q = new URLSearchParams(window.location.search);
      if (!q.has('log')) return;
      var onScreen = q.get('log') !== 'quiet';
      var scene = q.get('scene') || '';
      var box = null;
      if (onScreen) {
        box = document.createElement('div');
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;' +
          'max-height:38%;overflow-y:auto;z-index:9;background:rgba(0,0,0,.78);' +
          'color:#8f8;font:11px/1.35 monospace;padding:4px 6px;' +
          'white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;' +
          'user-select:text';
        var ready = function () { document.body.appendChild(box); };
        if (document.body) ready();
        else document.addEventListener('DOMContentLoaded', ready);
      }
      // One beacon per line is a request per line; batch on a short
      // timer instead, and flush on the way out.
      var pending = [], timer = null;
      var flush = function () {
        timer = null;
        if (!pending.length || !scene) return;
        var body = pending.join('\n');
        pending = [];
        try { navigator.sendBeacon(scene + '/log', body); } catch (e) {}
      };
      var emit = function (kind, args) {
        var line = kind + ' ' + Array.prototype.map.call(args, function (a) {
          if (typeof a === 'string') return a;
          try { return JSON.stringify(a); } catch (e) { return String(a); }
        }).join(' ');
        // A stack of megabytes of WebGL warnings helps nobody.
        if (line.length > 600) line = line.slice(0, 600) + '…';
        if (box) {
          var atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
          box.appendChild(document.createTextNode(line + '\n'));
          while (box.childNodes.length > 400) box.removeChild(box.firstChild);
          if (atEnd) box.scrollTop = box.scrollHeight;
        }
        pending.push(line);
        if (pending.length > 40) flush();
        else if (timer === null) timer = setTimeout(flush, 700);
      };
      ['log', 'warn', 'error'].forEach(function (kind) {
        var was = console[kind].bind(console);
        console[kind] = function () {
          emit(kind === 'log' ? '.' : kind[0].toUpperCase(), arguments);
          was.apply(console, arguments);
        };
      });
      window.addEventListener('error', function (e) {
        emit('E', [e.message + ' @' + (e.filename || '?') + ':' + e.lineno,
                   (e.error && e.error.stack) || '']);
        flush();
      });
      window.addEventListener('unhandledrejection', function (e) {
        emit('E', ['unhandled rejection', String(e.reason)]);
        flush();
      });
      // The page going away is the last chance to say anything, and
      // for a tab killed under memory pressure it is the only one.
      window.addEventListener('pagehide', flush);
      window.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') flush();
      });
    })();

    var canvasElement = document.getElementById('canvas');
    canvasElement.addEventListener('webglcontextlost', function (e) {
      alert('WebGL context lost — please reload.');
      e.preventDefault();
    }, false);
    // Loading indicator, shared by the emscripten download phase and the
    // viewer's scene loading (fcviewer_status in main.cpp). text null/''
    // hides it; total > 0 shows a determinate bar, total == 0 the
    // indeterminate slide, total < 0 the label only.
    window.fcviewerStatus = function (text, loaded, total) {
      var st = document.getElementById('status');
      if (!text) { st.style.display = 'none'; return; }
      st.style.display = 'block';
      document.getElementById('statustext').textContent = text;
      var bar = document.getElementById('progress');
      var fill = document.getElementById('progressfill');
      // The fill grows from the left, so an animated *shrink* reads as the
      // bar emptying from the right — which is what a viewer sees as
      // "filling backwards". Shrinking only ever happens where one phase
      // hands over to the next (the scene fetch ends full, the
      // indeterminate slide is a fixed 25% wide, the byte-counted phase
      // starts low), and a handover is not progress running in reverse.
      // So growth animates and everything else is instant.
      var grow = function (pct) {
        var prev = parseFloat(fill.style.width) || 0;
        fill.style.transition = (pct + 0.01 < prev) ? 'none' : '';
        fill.style.width = pct + '%';
      };
      if (total > 0) {
        bar.style.display = 'block';
        if (bar.classList.contains('indet')) {
          // Leaving the slide: it owns width and margin, so drop to the
          // new value in one step rather than sweeping down to it.
          bar.classList.remove('indet');
          fill.style.transition = 'none';
          fill.style.width = '0';
        }
        grow(Math.min(100, 100 * loaded / total));
      } else if (total === 0) {
        bar.style.display = 'block';
        if (!bar.classList.contains('indet')) {
          fill.style.transition = 'none';
          fill.style.width = '0';
          bar.classList.add('indet');
        }
      } else {
        bar.style.display = 'none';
      }
    };
    var Module = {
      canvas: canvasElement,
      print: function () { console.log.apply(console, arguments); },
      printErr: function () { console.error.apply(console, arguments); },
      // The .data preloader reports "Downloading data... (loaded/total)";
      // parse the byte counts into the determinate bar.
      setStatus: function (t) {
        if (!t) return;
        var m = t.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m)
          window.fcviewerStatus(m[1].trim(), parseFloat(m[2]), parseFloat(m[4]));
        else
          window.fcviewerStatus(t, 0, 0);
      },
      monitorRunDependencies: function () {}
      // No onRuntimeInitialized hide: main() drives the indicator from here
      // on (scene fetch progress, then hides it once the scene is applied).
    };
    Module.setStatus('Loading…');
    window.onerror = function () { window.fcviewerStatus('Exception — see console', 0, -1); };
  </script>
  {{{ SCRIPT }}}
  <!-- The DOM UI layer (docs/ThinClient.md §3): built separately by
       src/Gui/Renderer/web (npm run build) into web/ next to this
       bundle. A page served without it just 404s this one request and
       the viewer runs bare — the canvas never depends on the chrome.
       Module only, NO stylesheet link here: a pending stylesheet
       blocks the whole page's first paint (a slow link showed the
       viewer as a long blank "loading scene"); the module injects its
       own CSS after paint. -->
  <script type="module" src="web/inspector.js"></script>
</body>
</html>
